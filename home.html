<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HabitHub - Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <script type="module">
        import { auth, db } from "./firebase.js";

        import {
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        import {
            doc,
            getDoc,
            setDoc
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(userRef);

                if (!docSnap.exists()) {
                    // Create user profile with email so others can search for it
                    await setDoc(userRef, {
                        email: user.email.toLowerCase(), // Store lowercase for easy searching
                        streak: 0,
                        friends: [],
                        lastCompletedDate: null
                    });
                }
            }
        });
        window.logout = function () {
            signOut(auth).then(() => {
                window.location.href = "login.html";
            });
        };
    </script>
    <div class="navbar">
        <h2 style="font-size: 100px;">HabitHub</h2>
        <button onclick="logout()" style="width:100px">Logout</button>
    </div>

    <div class="main">

        <div class="section">
            <div class="streak-box">
                🔥Streak: <span id="streakCount">0</span>
            </div>
            <h3>To-Do List</h3>

            <div class="todo-input">
                <input type="text" id="todoText" placeholder="Enter a task...">
                <button onclick="addTodo()">Add</button>
            </div>

            <div id="todoList"></div>
        </div>


        <div class="section">
            <h3>Find Friends</h3>
            <div class="todo-input">
                <input type="email" id="friendSearchInput" placeholder="Enter friend's email...">
                <button onclick="searchFriend()">Search</button>
            </div>
            <div id="searchResults"></div>

            <hr>
            <h3>My Friends</h3>
            <div id="friendsList"></div>
            <div class="section">
                <h3>🏆 Leaderboard</h3>
                <div id="leaderboardList">
                </div>
            </div>
        </div>


    </div>


    <script type="module" src="script.js"></script>

</body>

</html>
